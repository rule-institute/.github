# Canonical Rule Institute ecosystem orgs manifest.
#
# Single source of truth for the org list consumed by rule-institute
# cross-org sweep workflows (thin callers of swift-institute/.github
# reusable workflows; consumption mechanism tracked in
# swift-institute/.github#212). Peer of, and disjoint from,
# swift-institute's own manifest per the 2026-07-28 peer-institute ruling:
# no org appears in both, and swift-institute-bot is never installed here.
#
# Schema:
#   - name:         GitHub org slug (kebab-case)
#     role:         meta | raw | composition | application | reserved
#     jurisdiction: big-endian ISO 3166 token (nl, eu, us, us-nv, ...) or null
#     status:       active | reserved | frozen
#
# role per the rule-architecture skill (rule-institute/Skills):
#   meta         — institute meta repos (control plane, Skills, Internal)
#   raw          — authority encoding orgs, Apache-2.0
#   composition  — engine + per-jurisdiction composition, AGPL-3.0-only + commercial
#   application  — closed products
#   reserved     — defensively held name, never a residence
#
# status:
#   active   — governed and swept
#   reserved — exists to hold the name; profile only, no packages
#   frozen   — content pending migration/disposition; excluded from sweeps
#              (see rule-institute/Internal#2 for dispositions)
#
# Adding an org: append a record here after the org exists and carries its
# day-one profile. Orgs approved for deletion are removed from this file at
# deletion, not marked.

# ── meta ──────────────────────────────────────────────────────────────
- name: rule-institute
  role: meta
  jurisdiction: null
  status: active

